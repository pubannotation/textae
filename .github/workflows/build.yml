name: Build and Dist

on:
  push:
    branches:
      - stable/4
  pull_request:
    branches:
      - stable/4

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Run dist:build
      run: npm run dist:build
